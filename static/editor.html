<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>北南集 · 编辑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e1a;--card:#13172a;--border:#1e2850;--text:#d4def5;--muted:#6a789c;--blue:#5588ee;--pink:#e87890;--green:#4ac0a0;--red:#e05570}
body{font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:18px;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn-blue{background:var(--blue);color:#fff}
.btn-pink{background:var(--pink);color:#fff}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:12px}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 24px}
.tab{padding:12px 18px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:14px;border-bottom:2px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.content{padding:24px;max-width:1000px;margin:0 auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-head h2{font-size:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--muted);font-weight:500;font-size:11px}
tr:hover{background:var(--card)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;font-family:inherit}
.fg textarea{min-height:300px;resize:vertical;font-family:Consolas,monospace;font-size:13px;line-height:1.7}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--blue)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:6px;font-size:13px;z-index:300;animation:slideIn .3s}
.toast-ok{background:#0d2d20;border:1px solid rgba(34,197,94,.25);color:var(--green)}
.toast-err{background:#2d0d18;border:1px solid rgba(224,85,112,.25);color:var(--red)}
@keyframes slideIn{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:768px){.content{padding:14px}.tabs{padding:0 8px}.tab{padding:10px 12px;font-size:12px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar"><h1>北南集 · 编辑器</h1><div><span id="status" style="font-size:12px;color:var(--muted)"></span></div></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('article')">文章</button>
<button class="tab" onclick="switchTab('poem')">诗歌</button>
</div>
<div class="content" id="tc"></div>
<div id="toast"></div>

<script>
var tab='article';
var API='/api/save-article';
var items=[];

function toast(msg,err){var t=document.getElementById('toast');t.className='toast toast-'+(err?'err':'ok');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none'},3000)}

function switchTab(t){tab=t;document.querySelectorAll('.tab').forEach(function(b,i){b.className='tab'+(i===['article','poem'].indexOf(t)?' active':'')});load()}

async function load(){
document.getElementById('tc').innerHTML='<p style="color:var(--muted)">加载中...</p>';
try{
var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list',type:tab})});
var data=await r.json();
items=Array.isArray(data)?data:[];
if(!items.length){document.getElementById('tc').innerHTML='<div class="panel-head"><h2>'+(tab==='article'?'文章':'诗歌')+'</h2><button class="btn btn-blue" onclick="edit()">新建</button></div><div class="empty">还没有'+(tab==='article'?'文章':'诗歌')+'</div>';return}
var h='<div class="panel-head"><h2>'+(tab==='article'?'文章':'诗歌')+'管理</h2><button class="btn btn-blue" onclick="edit()">+ 新建</button></div>';
h+='<table><thead><tr><th>文件名</th><th></th></tr></thead><tbody>';
items.forEach(function(item,i){h+='<tr><td><b>'+item.name.replace('.md','').replace('.html','')+'</b></td><td><button class="btn btn-outline btn-sm" onclick="edit('+i+')">编辑</button> <button class="btn btn-outline btn-sm" style="color:var(--red)" onclick="del('+i+')">删除</button></td></tr>'});
h+='</tbody></table>';
document.getElementById('tc').innerHTML=h}catch(e){document.getElementById('tc').innerHTML='<p style="color:var(--red)">加载失败: '+e.message+'</p>'}
}

async function edit(idx){
var item=idx!==undefined?items[idx]:null;
var h='<div class="panel-head"><h2>'+(item?'编辑':'新建')+'</h2></div>';
h+='<form onsubmit="save(event'+(idx!==undefined?','+idx:'')+')">';
h+='<input type="hidden" id="f-slug" value="'+(item?item.name.replace('.md','').replace('.html',''):'')+'">';
h+='<div class="row"><div class="fg"><label>标题</label><input id="f-title" required></div><div class="fg"><label>日期</label><input type="date" id="f-date" value="'+new Date().toISOString().slice(0,10)+'"></div></div>';
h+='<div class="row"><div class="fg"><label>系列</label><input id="f-series" value="深度思考"></div><div class="fg"><label>封面</label><select id="f-cover"><option value="gradient-sunset">Sunset</option><option value="gradient-ocean">Ocean</option><option value="gradient-forest">Forest</option><option value="gradient-dusk">Dusk</option><option value="gradient-aurora">Aurora</option><option value="gradient-ember">Ember</option><option value="gradient-mist">Mist</option><option value="gradient-void">Void</option></select></div></div>';
h+='<div class="fg"><label>标签（逗号分隔）</label><input id="f-tags"></div>';
h+='<div class="fg"><label>摘要</label><input id="f-excerpt"></div>';
h+='<div class="fg"><label>正文（Markdown）</label><textarea id="f-content"></textarea></div>';
h+='<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-outline" onclick="load()">取消</button><button type="submit" class="btn btn-blue">保存</button></div>';
h+='</form>';
document.getElementById('tc').innerHTML=h;

if(item){try{
var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get',type:tab,slug:item.name})});
if(r.ok){var d=await r.json();if(d.content){document.getElementById('f-content').value=d.content;document.getElementById('f-title').value=d.title||'';document.getElementById('f-date').value=d.date||'';document.getElementById('f-series').value=d.series||'';document.getElementById('f-tags').value=(d.tags||[]).join(', ');document.getElementById('f-excerpt').value=d.excerpt||''}}
}catch(e){console.error(e)}}
}

async function getContent(name){
try{
var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get',type:tab,slug:name})});
if(r.ok){var d=await r.json();return d.content||''}
}catch(e){}
return ''
}

async function save(e,idx){
e.preventDefault();
var slug=document.getElementById('f-slug').value||document.getElementById('f-title').value;
var title=document.getElementById('f-title').value;
var date=document.getElementById('f-date').value;
var series=document.getElementById('f-series').value;
var cover=document.getElementById('f-cover').value;
var tags=document.getElementById('f-tags').value.split(',').map(function(t){return t.trim()}).filter(Boolean);
var excerpt=document.getElementById('f-excerpt').value;
var content=document.getElementById('f-content').value;

try{
var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',type:tab,slug:slug,title:title,date:date,series:series,cover:cover,tags:tags,excerpt:excerpt,content:content})});
var d=await r.json();
if(r.ok){toast('保存成功！等待自动部署...');load()}else{toast('失败: '+d.error,true)}
}catch(e){toast('保存失败: '+e.message,true)}
}

async function del(idx){
if(!confirm('确认删除 '+items[idx].name+' ?'))return;
try{
var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',type:tab,slug:items[idx].name,title:items[idx].name})});
if(r.ok){toast('已删除，等待自动部署...');load()}else{var d=await r.json();toast('失败: '+d.error,true)}
}catch(e){toast('删除失败: '+e.message,true)}
}

load();
</script>
</body>
</html>
